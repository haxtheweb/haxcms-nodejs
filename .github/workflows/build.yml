name: build
on:
  push:
    branches: [main]
  # No branch filter: stacked PRs (base is another feature branch) must run too.
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-conformance:
    name: "unit + api-conformance (node ${{ matrix.node-version }})"
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the format check below can diff against the base branch.
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-yarn-
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Format check (changed files)
        # Prettier is not clean repo-wide (about 300 legacy files fail it), so
        # this checks only the files a PR changes. A changed file that was
        # already unformatted on the base branch is reported but does not fail.
        # Runs the same script as `yarn precheck` locally.
        run: yarn precheck
      - name: Build
        run: yarn run build
      - name: Unit + API conformance tests
        run: npm test
      - name: Lint
        # Advisory only: lint runs after the real tests and never fails the
        # build (findings still show as annotations / in the log).
        continue-on-error: true
        run: yarn lint
      - name: Coverage
        run: npm run test:coverage
      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
      - name: Dependency audit (reporting only)
        # Security (HAX-SEC-010, haxtheweb/issues#3092): surface high/critical
        # advisories in runtime dependencies. This repo's lockfile is yarn.lock
        # (package-lock.json is gitignored), so `npm audit` cannot run here (it
        # exits ENOLOCK); `yarn audit` (Yarn 1) reads yarn.lock instead.
        # Reporting-only: a finding emits a workflow warning and a job summary
        # but does not fail CI. Remove the `|| ...` fallback to make it blocking
        # once existing advisories are triaged.
        run: |
          set +e
          yarn audit --groups dependencies --level high | tee audit.txt
          status=${PIPESTATUS[0]}
          {
            echo '### Dependency audit (yarn audit, runtime deps, level >= high)'
            echo
            echo '```'
            tail -n 60 audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Dependency audit::yarn audit reported high/critical advisories or failed to run (exit $status). Reporting only; see job summary."
          fi
          exit 0

  e2e:
    name: "e2e UI (node ${{ matrix.node-version }})"
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Non-gating while flakiness is characterized; flip to a hard requirement
    # once the suite is stable so PRs are blocked on real E2E regressions.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-yarn-
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn run build
      - name: E2E UI tests
        # ubuntu-latest ships Google Chrome at /usr/bin/google-chrome, which
        # the harness auto-detects (src/lib/convertUtils.js findChromeExecutable).
        # Override with PUPPETEER_EXECUTABLE_PATH if the default is unavailable.
        run: npm run test:e2e
