name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-and-conformance:
    name: "unit + api-conformance (node ${{ matrix.node-version }})"
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Yarn
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-yarn-
      - name: Install
        run: yarn install
      - name: Build
        run: yarn run build
      - name: Unit + API conformance tests
        run: npm test
      - name: Coverage
        run: npm run test:coverage
      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac0ea254df3be9e589e35a36c9fa8 # v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
      - name: Dependency audit
        # Security (HAX-SEC-010): surface high-severity runtime dependency
        # vulnerabilities. --omit=dev ignores dev-tool noise; --audit-level=high
        # focuses on high/critical. continue-on-error keeps CI green while
        # pre-existing advisories are triaged; flip to blocking once triaged.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: "e2e UI (node ${{ matrix.node-version }})"
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Non-gating while flakiness is characterized; flip to a hard requirement
    # once the suite is stable so PRs are blocked on real E2E regressions.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Yarn
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-yarn-
      - name: Install
        run: yarn install
      - name: Build
        run: yarn run build
      - name: E2E UI tests
        # ubuntu-latest ships Google Chrome at /usr/bin/google-chrome, which
        # the harness auto-detects (src/lib/convertUtils.js findChromeExecutable).
        # Override with PUPPETEER_EXECUTABLE_PATH if the default is unavailable.
        run: npm run test:e2e
