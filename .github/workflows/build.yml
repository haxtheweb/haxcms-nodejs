name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-and-conformance:
    name: "unit + api-conformance (node ${{ matrix.node-version }})"
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-yarn-
      - name: Install
        run: yarn install
      - name: Build
        run: yarn run build
      - name: Unit + API conformance tests
        run: npm test
      - name: Coverage
        run: npm run test:coverage
      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
      - name: Dependency audit
        # Security (HAX-SEC-010): surface high-severity runtime dependency
        # vulnerabilities. --omit=dev ignores dev-tool noise; --audit-level=high
        # focuses on high/critical. continue-on-error keeps CI green while
        # pre-existing advisories are triaged; flip to blocking once triaged.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: "e2e UI (node ${{ matrix.node-version }})"
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Non-gating while flakiness is characterized; flip to a hard requirement
    # once the suite is stable so PRs are blocked on real E2E regressions.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-yarn-
      - name: Install
        run: yarn install
      - name: Build
        run: yarn run build
      - name: E2E UI tests
        # ubuntu-latest ships Google Chrome at /usr/bin/google-chrome, which
        # the harness auto-detects (src/lib/convertUtils.js findChromeExecutable).
        # Override with PUPPETEER_EXECUTABLE_PATH if the default is unavailable.
        run: npm run test:e2e
