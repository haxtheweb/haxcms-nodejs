name: build
on:
  push:
    branches: [main]
  # No branch filter: stacked PRs (base is another feature branch) must run too.
  pull_request:
  # Nightly regression run on the latest default branch (haxtheweb/issues#3262):
  # same unit, api-conformance and coverage steps plus the dependency audit;
  # e2e stays report-only (continue-on-error below). A failure shows up as a
  # failed scheduled run.
  schedule:
    - cron: "47 6 * * *" # nightly, 06:47 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-conformance:
    name: "unit + api-conformance (node ${{ matrix.node-version }})"
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the format check below can diff against the base branch.
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-yarn-
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Format check (changed files)
        # Prettier is not clean repo-wide (about 300 legacy files fail it), so
        # this checks only the files a PR changes. A changed file that was
        # already unformatted on the base branch is reported but does not fail.
        # Runs the same script as `yarn precheck` locally.
        run: yarn precheck
      - name: Build
        run: yarn run build
      - name: Unit + API conformance tests
        run: npm test
      - name: Lint
        # Advisory only: lint runs after the real tests and never fails the
        # build (findings still show as annotations / in the log).
        continue-on-error: true
        run: yarn lint
      - name: Coverage
        run: npm run test:coverage
      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
      - name: Dependency audit (blocking, runtime deps, level >= high)
        # Security (SEC-DEPLOY, haxtheweb/issues#3092): fail CI on high /
        # critical advisories in runtime dependencies. This repo's lockfile is
        # yarn.lock (package-lock.json is gitignored), so `npm audit --omit=dev`
        # cannot run here (ENOLOCK); `yarn audit --groups dependencies` (Yarn 1)
        # reads yarn.lock and is the equivalent. Yarn 1 exits with a bitmask
        # (1 info, 2 low, 4 moderate, 8 high, 16 critical) and `--level` only
        # filters the printed table, not the exit code, so the high (8) and
        # critical (16) bits are masked explicitly: moderate-and-below never
        # block, high/critical always do.
        run: |
          set +e
          yarn audit --groups dependencies --level high | tee audit.txt
          raw=${PIPESTATUS[0]}
          status=$(( raw & 24 ))
          {
            echo '### Dependency audit (yarn audit, runtime deps, level >= high)'
            echo
            echo '```'
            tail -n 60 audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error title=Dependency audit::yarn audit reported high/critical advisories in runtime dependencies (exit $raw). See job summary."
            exit 1
          fi

  e2e:
    name: "e2e UI (node ${{ matrix.node-version }})"
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Non-gating while flakiness is characterized; flip to a hard requirement
    # once the suite is stable so PRs are blocked on real E2E regressions.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-yarn-
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn run build
      - name: E2E UI tests
        # ubuntu-latest ships Google Chrome at /usr/bin/google-chrome, which
        # the harness auto-detects (src/lib/convertUtils.js findChromeExecutable).
        # Override with PUPPETEER_EXECUTABLE_PATH if the default is unavailable.
        run: npm run test:e2e
      - name: Upload e2e screenshots
        # The .current.png/.diff.png files this run rendered, so a visual
        # regression can be inspected (and CI-rendered baselines refreshed).
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshots-node-${{ matrix.node-version }}
          path: |
            test/e2e/__screenshots__/*.current.png
            test/e2e/__screenshots__/*.diff.png
          if-no-files-found: ignore
          retention-days: 14
