name: release-notes
# Fills an EMPTY GitHub Release body from the matching CHANGELOG.md section
# (haxtheweb/issues#3092). CHANGELOG.md is generated by commit-and-tag-version
# during `npm run release`, so it already exists at the tagged commit.
#
# Safe by construction: a release that already has notes is never touched, a
# release whose CHANGELOG section is missing/empty is left as-is with a
# warning, and nothing is published to npm.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to fill (e.g. v26.8.1)
        required: true
permissions:
  contents: read
jobs:
  fill-release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only to edit the body of an existing release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Fill empty release body from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          body="$(gh release view "$TAG" --repo "$REPO" --json body --jq .body)"
          if [ -n "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "Release $TAG already has notes; leaving unchanged."
            exit 0
          fi
          if ! node scripts/extract-changelog-section.js "$TAG" > release-notes.md; then
            echo "::warning title=Release notes::No CHANGELOG.md entries found for $TAG; release body left empty."
            exit 0
          fi
          gh release edit "$TAG" --repo "$REPO" --notes-file release-notes.md
          echo "Release notes for $TAG populated from CHANGELOG.md."
